name: Documentation

on:
  push:
    branches: [main, master]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: guillaumeriousat/mdbook-i18n-helpers:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the English and French books
        run: |
          cd docs
          MDBOOK_BOOK__LANGUAGE=en mdbook build -d ../site/en
          MDBOOK_BOOK__LANGUAGE=fr mdbook build -d ../site/fr
          cp index.html ../site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
