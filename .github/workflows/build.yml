name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main, master]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

# a newer push supersedes the build of an older one
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            artifact-name: linux-x86_64
          - os: macos-latest
            platform: macos-arm
            artifact-name: macos-arm
          - os: windows-latest
            platform: windows
            artifact-name: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scenic needs the NDI and LTC addons, and score-plugin-avnd for its
      # gain stage; videoio brings capture and playout hardware backends.
      - name: ossia score build
        id: score
        uses: ossia/actions/custom-score-build@master
        with:
          cmake-options: >
            -DSCORE_ENABLE_ADDONS=score-addon-ndi,score-addon-ltc,score-addon-videoio
            -DSCORE_DISABLE_PLUGINS=score-plugin-faust,score-plugin-jit,score-plugin-vst,score-plugin-vst3,score-plugin-clap,score-plugin-lv2,score-plugin-pd,score-plugin-ysfx,score-plugin-controlsurface,score-plugin-spline3d,score-plugin-recording,score-plugin-nodal,score-plugin-spline,score-plugin-mapping,score-plugin-threedim
            -DSCORE_QT_PLUGINS_NO_QTQUICK3D=1
          macos-certificate-base64: ${{ secrets.MAC_CERT_B64 }}
          macos-certificate-password: ${{ secrets.MAC_CERT_PASSWORD }}
          macos-notarize-team-id: ${{ secrets.MAC_NOTARIZE_TEAM_ID }}
          macos-notarize-apple-id: ${{ secrets.MAC_NOTARIZE_APPLE_ID }}
          macos-notarize-password: ${{ secrets.MAC_NOTARIZE_PASSWORD }}

      # The headless suites, against the engine just built. The AppImage is
      # extracted rather than run: runners have no FUSE. Its AppRun locates
      # the application through APPDIR, which the AppImage runtime would set.
      - name: Tests
        if: runner.os == 'Linux'
        run: |
          set -eu
          # libraries the AppImage takes from the host, as its startup check lists
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2t64 libavahi-client3 libbluetooth3 \
            libdbus-1-3 libegl1 libglx0 libopengl0 libv4l-0 libwayland-cursor0 \
            libwayland-egl1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
            libxcb-util1 libxcb-xinput0 libxcb-xkb1 libxcomposite1 libxext6 \
            libxkbcommon-x11-0 libxrandr2
          # runners have no audio device
          export SCORE_AUDIO_BACKEND=dummy
          img=$(find score-src/staging -maxdepth 1 -name '*.AppImage' | head -1)
          test -n "$img"
          chmod +x "$img"
          "$img" --appimage-extract > /dev/null
          export APPDIR="$PWD/squashfs-root"
          export SCORE_BIN="$APPDIR/AppRun"
          # Seed 99's device churn hits a heap corruption in score's device
          # teardown in about half the runs; it stays in the local default set.
          SCENIC_FUZZ_SEEDS="1 2 3 7 13 42" ./tools/test-stress.sh
          SCENIC_PROTO_SCENARIOS="schema graph" ./tools/test-protocols.sh

      - name: Test logs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/scenic-*.log
          retention-days: 7

      - name: Package
        uses: ossia/actions/package-custom-app@master
        with:
          output-path: packages
          app-name: "Scenic Native Pro"
          qml-files: "qml"
          score-build-id: ${{ steps.score.outputs.artifact-id }}
          platforms: ${{ matrix.platform }}
          app-organization: "SAT"
          app-domain: "sat.qc.ca"
          app-identifier: "ca.qc.sat.scenic"
          app-description: "Telepresence and media routing"
          app-environment: environment
          app-copyright: "Société des Arts Technologiques"
          app-version: "1.0"
          app-png: "resources/scenic.png"
          app-icns: "resources/scenic.icns"
          app-ico: "resources/scenic.ico"
          macos-certificate-base64: ${{ secrets.MAC_CERT_B64 }}
          macos-certificate-password: ${{ secrets.MAC_CERT_PASSWORD }}
          macos-notarize-team-id: ${{ secrets.MAC_NOTARIZE_TEAM_ID }}
          macos-notarize-apple-id: ${{ secrets.MAC_NOTARIZE_APPLE_ID }}
          macos-notarize-password: ${{ secrets.MAC_NOTARIZE_PASSWORD }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: scenic-native-${{ matrix.artifact-name }}
          path: packages/${{ matrix.artifact-file || '' }}
          retention-days: 30

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: all-packages
          pattern: scenic-native-*
          merge-multiple: true

      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: all-packages/*
          generate_release_notes: true

      - name: Continuous release (main branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          name: "Continuous Build"
          tag_name: "continuous"
          files: all-packages/*
          prerelease: true
